name: Validate Legacy Driver PR

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: legacy-driver-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate legacy driver contribution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Show repository information
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "PR: #${{ github.event.pull_request.number }}"
          echo "Source branch: ${{ github.head_ref }}"
          echo "Target branch: ${{ github.base_ref }}"

      - name: Find changed files
        id: changed-files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" | tee changed-files.txt

      - name: Detect changed driver directories
        id: drivers
        run: |
          python3 <<'PY'
          import os
          from pathlib import Path

          changed_file = Path("changed-files.txt")

          drivers = set()

          if changed_file.exists():
              for line in changed_file.read_text().splitlines():
                  path = Path(line)

                  # Expected structure:
                  #
                  # drivers/<driver-name>/...
                  #
                  # Change this if the repository uses a different
                  # top-level directory for drivers.

                  parts = path.parts

                  if len(parts) >= 2 and parts[0] == "drivers":
                      drivers.add(parts[1])

          print("Detected driver directories:")

          if not drivers:
              print("No driver directory changes detected.")
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("found=false\n")
                  f.write("drivers=\n")
          else:
              for driver in sorted(drivers):
                  print(f"  - {driver}")

              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("found=true\n")
                  f.write("drivers<<EOF\n")
                  for driver in sorted(drivers):
                      f.write(f"{driver}\n")
                  f.write("EOF\n")
          PY

      - name: Validate changed driver directories
        if: steps.drivers.outputs.found == 'true'
        env:
          DRIVERS: ${{ steps.drivers.outputs.drivers }}
        run: |
          set -e

          FAILED=0

          while IFS= read -r DRIVER; do
            [ -z "$DRIVER" ] && continue

            DRIVER_DIR="drivers/$DRIVER"

            echo ""
            echo "=========================================="
            echo "Validating driver: $DRIVER"
            echo "Directory: $DRIVER_DIR"
            echo "=========================================="

            if [ ! -d "$DRIVER_DIR" ]; then
              echo "::error::Driver directory does not exist: $DRIVER_DIR"
              FAILED=1
              continue
            fi

            #
            # 1. README / documentation
            #

            if [ ! -f "$DRIVER_DIR/README.md" ]; then
              echo "::error file=$DRIVER_DIR/README.md::Missing README.md"
              FAILED=1
            else
              echo "✓ README.md exists"
            fi

            #
            # 2. Original source
            #

            if [ ! -d "$DRIVER_DIR/original-source" ]; then
              echo "::error file=$DRIVER_DIR/original-source::Missing original-source directory"
              FAILED=1
            else
              if find "$DRIVER_DIR/original-source" -type f | grep -q .; then
                echo "✓ Original source directory contains files"
              else
                echo "::error file=$DRIVER_DIR/original-source::Original source directory is empty"
                FAILED=1
              fi
            fi

            #
            # 3. Patches
            #

            if [ ! -d "$DRIVER_DIR/patches" ]; then
              echo "::warning file=$DRIVER_DIR/patches::No patches directory found"
            else
              echo "✓ Patches directory exists"

              if find "$DRIVER_DIR/patches" -type f | grep -q .; then
                echo "✓ Patch files found"
              else
                echo "::warning file=$DRIVER_DIR/patches::Patches directory is empty"
              fi
            fi

            #
            # 4. Build instructions
            #

            BUILD_FOUND=0

            for file in \
              "$DRIVER_DIR/BUILD.md" \
              "$DRIVER_DIR/build.md" \
              "$DRIVER_DIR/README.md"
            do
              if [ -f "$file" ]; then
                if grep -Eiq \
                  'configure|make|build|environment|install|patch' \
                  "$file"; then
                  BUILD_FOUND=1
                  break
                fi
              fi
            done

            if [ "$BUILD_FOUND" -eq 1 ]; then
              echo "✓ Build/install information appears to be documented"
            else
              echo "::error file=$DRIVER_DIR/README.md::Could not find clear build/install instructions"
              FAILED=1
            fi

            #
            # 5. Check for obvious generated/binary files
            #

            if find "$DRIVER_DIR/original-source" \
                -type f \
                \( \
                  -name '*.o' \
                  -o -name '*.a' \
                  -o -name '*.so' \
                  -o -name '*.exe' \
                  -o -name '*.dll' \
                  \) \
                -print -quit | grep -q .; then

              echo "::error file=$DRIVER_DIR/original-source::Compiled/binary artifacts found in original-source"
              FAILED=1
            else
              echo "✓ No obvious compiled artifacts found in original-source"
            fi

            #
            # 6. Check for Git repositories accidentally copied
            #

            if find "$DRIVER_DIR/original-source" \
                -type d \
                -name ".git" \
                -print -quit | grep -q .; then

              echo "::error file=$DRIVER_DIR/original-source::Nested .git directory found in original-source"
              FAILED=1
            else
              echo "✓ No nested Git repository found"
            fi

            #
            # 7. Check README for provenance-related information
            #

            if [ -f "$DRIVER_DIR/README.md" ]; then

              PROVENANCE_FOUND=0

              if grep -Eiq \
                'upstream|original source|provenance|maintainer|source' \
                "$DRIVER_DIR/README.md"; then
                PROVENANCE_FOUND=1
              fi

              if [ "$PROVENANCE_FOUND" -eq 1 ]; then
                echo "✓ README contains provenance/source information"
              else
                echo "::error file=$DRIVER_DIR/README.md::README should document the original source/upstream provenance"
                FAILED=1
              fi

            fi

            #
            # 8. Check README for patch information
            #

            if [ -f "$DRIVER_DIR/README.md" ]; then

              PATCH_INFO_FOUND=0

              if grep -Eiq \
                'patch|patches' \
                "$DRIVER_DIR/README.md"; then
                PATCH_INFO_FOUND=1
              fi

              if [ "$PATCH_INFO_FOUND" -eq 1 ]; then
                echo "✓ README contains patch information"
              else
                echo "::warning file=$DRIVER_DIR/README.md::README does not appear to describe patches"
              fi

            fi

            #
            # 9. Check README for build environment information
            #

            if [ -f "$DRIVER_DIR/README.md" ]; then

              ENV_INFO_FOUND=0

              if grep -Eiq \
                'environment|variable|configure|make|compiler|dependency' \
                "$DRIVER_DIR/README.md"; then
                ENV_INFO_FOUND=1
              fi

              if [ "$ENV_INFO_FOUND" -eq 1 ]; then
                echo "✓ README contains build environment information"
              else
                echo "::warning file=$DRIVER_DIR/README.md::README may need more detailed build environment instructions"
              fi

            fi

            #
            # Final result for this driver
            #

            if [ "$FAILED" -ne 0 ]; then
              echo ""
              echo "❌ Validation failed for $DRIVER"
            else
              echo ""
              echo "✅ Validation passed for $DRIVER"
            fi

          done <<< "$DRIVERS"

          if [ "$FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: No driver changes detected
        if: steps.drivers.outputs.found != 'true'
        run: |
          echo "No changes were detected under drivers/<driver-name>/."
          echo "Skipping legacy-driver validation."

      - name: Generate validation summary
        if: always()
        env:
          DRIVERS: ${{ steps.drivers.outputs.drivers }}
        run: |
          {
            echo "# Legacy Driver Validation"
            echo ""
            echo "## Pull Request"
            echo ""
            echo "- PR: #${{ github.event.pull_request.number }}"
            echo "- Repository: ${{ github.repository }}"
            echo "- Target branch: ${{ github.base_ref }}"
            echo ""
            echo "## Changed drivers"
            echo ""

            if [ -n "$DRIVERS" ]; then
              while IFS= read -r DRIVER; do
                [ -z "$DRIVER" ] && continue
                echo "- \`$DRIVER\`"
              done <<< "$DRIVERS"
            else
              echo "No driver directories detected."
            fi

            echo ""
            echo "## Important"
            echo ""
            echo "Passing CI does not prove that the driver is historically the correct"
            echo "upstream source or that the driver is safe on hardware."
            echo ""
            echo "A maintainer must still review:"
            echo ""
            echo "- Original source provenance"
            echo "- Upstream maintenance status"
            echo "- Distribution sources and patches"
            echo "- Correctness of patches"
            echo "- Preservation of original functionality"
            echo ""
            echo "CI validates repository structure and mechanically testable requirements."
          } >> "$GITHUB_STEP_SUMMARY"